# ═══════════════════════════════════════════════════════════════════════════════
# CANONICAL MIRROR of the LIVE staging edge config: /etc/nginx/sites-available/dawntrader
# Captured 2026-09-30, sha256 e8ca614b4f1979c4a368387edb042d779e840d5751c25127cb01df0013b2ff94
# (live mtime 2026-09-30T15:41:29Z). A server rebuild that installs this file preserves the
# B-SEC-HARDEN (#1022) compensating edge controls below.
#
# ⛔ THIS SUPERSEDES the prior stale Batch-40 template that lived here (it described an EC2 +
#    certbot + staging.dawntrader.com setup that does NOT match reality). LIVE topology:
#    Caddy owns :443/:80 (Let's Encrypt for 188.245.193.8.sslip.io) -> reverse_proxy 127.0.0.1:8080
#    -> nginx (this file, listen 127.0.0.1:8080) -> app 127.0.0.1:5000. See /etc/caddy/Caddyfile.
#    ⚠️ This mirrors the ONE control I changed + the surrounding live config; a full line-by-line
#    review/normalisation of the whole edge config is owed to B-SEC-HARDEN, not done here.
#
# B-SEC-HARDEN (#1022) — the edge controls below are a COMPENSATING CONTROL for a live anonymous
# path-traversal + wholly-unauthenticated /api/audit. VERIFIED by Langston at the live config
# 2026-09-30 (all disclosing vectors -> 403, uniform len=162 edge page; the double-slash+token
# spellings that walk around the $dt_bad_report anchor are caught by $dt_bad_token; %2e%2e/ and
# %c0%af -> 403; /api/audit/run -> 403; anchor holds: /api/auditlog, /api/audit-something -> 404;
# regression clear: query-side %2F symbol=X%2FUSD -> 401/404, never 403).
# EVIDENCE (recorded here, not log-hit counts which are an untested retention window):
#   * blast radius: client census `grep api/audit client/` = 0 of 513 /api/ refs (positive control
#     api/diagnostics returns hits) — no UI calls /api/audit.
#   * external reachability: off-box (laptop) probe, one run with a :443 positive control:
#     https://188.245.193.8.sslip.io/api/health -> 200 (0.41s); http://188.245.193.8:5000 and :8080
#     -> timeout, no response (curl exit 28). So the only ingress is :443->Caddy->nginx.
# ⚠️ EXTERNAL path only — the app-level :5000 traversal + the /api/audit auth hole are UNTOUCHED;
#    those are the 10-02 safe-path.ts deploy (traversal) and B-AUDIT-ROUTE-AUTH (auth), the TWO
#    removal conditions the inline header states. Two clean-name notes (Langston, do not misread):
#    /api/audit/reports/CSAV_Report_ok.json -> 403 is CORRECT post-widen (the whole /api/audit deny
#    removed the CSAV allowlist row; only TLVA keeps its allowlist). And /api//audit//reports//
#    CSAV_Report_x.json -> 404 is file-not-found, NOT a block — safe ONLY because escaping reports/
#    needs a traversal token, which $dt_bad_token 403s (proven).
# ═══════════════════════════════════════════════════════════════════════════════

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tokenwatch:1m rate=20r/s;

# P19 B-SEC-HARDEN Step-3: preserve Caddy's X-Forwarded-Proto across the localhost hop
# (Caddy terminates TLS on :443 and proxies here plaintext; without this, $scheme=http
#  would overwrite Caddy's https and the app would mis-detect the client scheme).
map $http_x_forwarded_proto $fwd {
    default  $scheme;
    "https"  https;
    "http"   http;
}

# B-SEC-HARDEN (#1022) — COMPENSATING CONTROLS at the edge. Ruled by Langston 2026-09-30; applied
# by Infra Claude, then ratified by Langston at the live resolved config. TWO holes, TWO expiries:
#  (T) TRAVERSAL: a LIVE anonymous path-traversal in the report routes (/api/audit + /api/tlva
#      /reports), run anon through :443 -> 200 reading files outside the base. Closed by
#      $dt_bad_report (report-name allowlist) + $dt_bad_token (path-side traversal-token deny). The
#      real fix (server/services/safe-path.ts) is Langston-Step-4-approved but UNDEPLOYED (deploy
#      drift #1001); ships in the 10-02 release. ⇒ THE TRAVERSAL CONTROLS COME OFF ONLY AFTER that
#      deploy verifies (a traversal name 400s at the app, a real download 200s).
#  (A) AUTH: /api/audit is WHOLLY UNAUTHENTICATED (4 routes, audit.ts:17/45/83/121, incl /run which
#      triggers work + writes a report). Closed by the whole-prefix arm below. safe-path fixes
#      TRAVERSAL, not AUTH — so this arm must NOT lift on 10-02. ⇒ IT COMES OFF ONLY WHEN
#      B-AUDIT-ROUTE-AUTH ships auth on /api/audit. ONE MAP, TWO EXPIRIES. #1022 stays open meanwhile.
#
# WHY $request_uri (Langston MEASURED, not reasoned): Caddy (:443) forwards %2F intact; nginx DECODES
# %2F and resolves ../ building $uri BEFORE location matching, and every proxy_pass has no URI part,
# so the RAW URI reaches the app. $request_uri is the only variable that still holds what the app sees.
# ⛔ THERE IS NO $request_uri PREFIX INVARIANT — Express tolerates spellings a ^-anchored stem regex
#    misses (/api//audit/, /api/audit//reports/) and STILL routes them to the handler (MEASURED
#    disclosing). So traversal is caught ORTHOGONALLY by $dt_bad_token (ANY path-side traversal token,
#    which every escape out of reports/ must use), NOT by enumerating stems. return 403 (not 404)
#    keeps the edge uniquely attributable vs the app's own 400/404.
# EVIDENCE for the whole-/api/audit widen: client census `grep api/audit client/` = 0 of 513 /api/
#    hits (positive control: api/diagnostics returns hits). :5000/:8080 filtered externally, PROVEN
#    off-box with a :443 positive control (recorded in the mirror). ⚠️ EXTERNAL path only — the
#    app-level :5000 traversal is untouched; that is B-AUDIT-ROUTE-AUTH + the deploy.
# RIDER: efficacy rests on ufw default-deny (only 22/80/443 ALLOW) — a ufw change silently un-does it.
map $request_uri $dt_bad_report {
    default 0;
    # /api/tlva is authenticated; keep its report-name allowlist (defence in depth beside $dt_bad_token).
    # /api/audit whole-prefix widen — hole (A) in the header. Anchored (/|\?|$) so a future
    # /api/auditXYZ is not swept in. Removal is bound to B-AUDIT-ROUTE-AUTH, NOT the 10-02 deploy.
    "~*^/api/tlva/reports/TLVA_Report_[A-Za-z0-9_-]+\.json(\?|$)" 0;
    "~*^/api/audit(/|\?|$)"                                        1;
    "~*^/api/tlva/reports/"                                        1;
}

# B-SEC-HARDEN (#1022, Langston re-fix 2026-09-30) — ORTHOGONAL anti-traversal, not another
# enumeration. The $dt_bad_report allowlist above is ^-anchored on the raw stem, but Express's
# router tolerates spellings the regex misses (`/api//audit/`, `/api/audit//reports/`), so those
# reached the handler and disclosed (MEASURED by Langston: 200, real package.json). Leaving
# `reports/` requires a path-side separator, so instead of enumerating spellings we DENY the token.
# ⛔ `[^?]*` confines the match to the PATH: query-side %2F is the live UI (symbol=ZS%2FUSD, 140 hits,
#    all 200) and a whole-URI guard would break the dashboard. Path-side %2f/%5c/%252f/%2e/.. measured
#    ZERO across 678,932 pre-probe log lines (14 rotations back to 2026-09-16). Same ufw rider applies.
map $request_uri $dt_bad_token {
    default 0;
    "~*^[^?]*(%2f|%5c|%252f|%2e|\.\.)" 1;
}

upstream dawntrader_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    # B-SEC-HARDEN Step-3: nginx demoted to localhost:8080 behind Caddy (was :80). Rollback: listen 80 + remove Caddy.
    listen 127.0.0.1:8080;
    server_name _;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # B-SEC-HARDEN (#1022) — server-scope so it enforces for EVERY request regardless of which
    # location the normalised $uri selects (rewrite phase runs before location selection). See the
    # $dt_bad_report map above. A bare `return` is one of the two documented-safe uses of `if`.
    if ($dt_bad_report) { return 403; }

    # B-SEC-HARDEN (#1022, Langston re-fix 2026-09-30) — deny any path-side traversal token
    # (%2f/%5c/%252f/%2e/.. before the query). Catches the doubled-slash spellings the allowlist
    # missed, orthogonally: every escape out of reports/ carries one of these in the path.
    if ($dt_bad_token) { return 403; }

    # B-CHAPLET-OFF-HOTFIX (#1101) — MOVED to server-scope $request_uri (Langston, 2026-09-30):
    # the prior `location ~* ^/chaplet` had the IDENTICAL bypass — measured /chaplet/a/..%2F..%2Fstatus
    # -> 200, escaped the location block. Stem kept UNBOUNDED to preserve the hotfix's exact breadth.
    if ($request_uri ~* "^/chaplet") { return 404; }

    # ═══════════════════════════════════════════════════════════════════
    # B-TOKEN-WATCH — the capture-only observation study's webhook.
    # Its own path, its own upstream, its own rate zone. It shares NOTHING
    # with the trading app but the proxy itself.
    #
    # ⛔ THE AUTHORIZATION HEADER MUST REACH THE UPSTREAM. The receiver fails
    #    CLOSED without it, so stripping this header turns the endpoint into a
    #    401 generator — which looks exactly like a revoked secret.
    # ═══════════════════════════════════════════════════════════════════
    location /token-watch/webhook {
        limit_req zone=tokenwatch burst=100 nodelay;
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else — proxy to app (SPA fallback)
    location / {
        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd;
        proxy_set_header Connection "";
    }
}
