# DawnTrader nginx Configuration
# Location on EC2: /etc/nginx/sites-available/dawntrader
# Symlink: ln -s /etc/nginx/sites-available/dawntrader /etc/nginx/sites-enabled/
#
# Prerequisites:
#   - nginx installed: sudo apt install nginx
#   - certbot for SSL: sudo apt install certbot python3-certbot-nginx
#   - SSL cert obtained: sudo certbot --nginx -d staging.dawntrader.com
#
# After placing this file:
#   sudo nginx -t          # Test config
#   sudo systemctl reload nginx

# Rate limiting zone (10 requests/second per IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Upstream — DawnTrader app on port 5000
upstream dawntrader_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name staging.dawntrader.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name staging.dawntrader.com;

    # SSL — managed by certbot (paths updated automatically)
    # ssl_certificate /etc/letsencrypt/live/staging.dawntrader.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.dawntrader.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for file uploads if any)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API routes — with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # WebSocket endpoint — context-bridge real-time data
    location /ws {
        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (CRITICAL)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket keepalive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static frontend assets — serve directly from built files
    # Uncomment if serving static files directly from nginx instead of through Node
    # location /assets/ {
    #     alias /home/deploy/dawntrader/dist/public/assets/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Everything else — proxy to app (SPA fallback)
    location / {
        proxy_pass http://dawntrader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
