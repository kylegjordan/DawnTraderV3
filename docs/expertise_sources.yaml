# Credibility Score Definitions
credibility_definitions:
  score_5:
    label: "Highly Credible"
    criteria:
      - "Published author with recognized works"
      - "20+ years of documented experience"
      - "Widely cited by trading community"
      - "Proven track record or academic credentials"
      - "Methodology validated over time"
    
  score_4:
    label: "Credible"
    criteria:
      - "Established educator or platform"
      - "10+ years of experience"
      - "Reputable platform or publication"
      - "Consistent and logical methodology"
      - "Positive community reputation"
    
  score_3:
    label: "Moderately Credible"
    criteria:
      - "Emerging educator"
      - "5+ years of experience"
      - "Growing following"
      - "Limited but positive track record"
    
  score_2:
    label: "Low Credibility"
    criteria:
      - "Unverified claims"
      - "Limited track record"
      - "Inconsistent methodology"
    
  score_1:
    label: "Not Credible"
    criteria:
      - "Unsubstantiated claims"
      - "Contradicts established principles"
      - "No verifiable credentials"

# Usage Rules
usage_rules:
  minimum_credibility: 4
  principle_sourcing:
    - "All principles must cite a source with credibility ≥ 4"
    - "Multi-source validation increases principle strength"
    - "Contradictory principles from high-credibility sources require reconciliation notes"
  
  source_updates:
    frequency: weekly
    process:
      - "Review top 3-5 sources for new insights"
      - "Extract ≤ 3 key insights per source"
      - "Maintain credibility threshold ≥ 4"
      - "Append to walter_expert_updates_YYYY-MM-DD.json"

# Prohibited Sources
prohibited_sources:
  - category: "Get-rich-quick schemes"
    rationale: "Promote unrealistic expectations and dangerous behaviors"
  
  - category: "Pump and dump promoters"
    rationale: "Market manipulation, not education"
  
  - category: "Leverage/margin promoters for crypto"
    rationale: "Conflicts with system's spot-only, long-only design"
  
  - category: "Unverified social media influencers"
    rationale: "Lack credible track records or methodologies"

# Source Review Schedule
review_schedule:
  daily:
    - "Monitor flagged sources for reputation changes"
    - "Track community sentiment on existing sources"
  
  weekly:
    - "Extract insights from approved sources"
    - "Update walter_expert_updates file"
    - "Review new potential sources"
  
  monthly:
    - "Comprehensive credibility audit of all sources"
    - "Add/remove sources based on performance"
    - "Update source metadata"
  
  quarterly:
    - "Major corpus revision"
    - "Source credibility recalibration"
    - "Strategic content gap analysis"

