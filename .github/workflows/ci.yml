# DawnTrader CI Pipeline
# Runs on a push to dawntrader-v4, main or any 'migration/**' branch, and on a
# pull request whose BASE branch has no '/' in its name. The pull_request
# filter '*' does not match '/', so a PR into migration/aws-supabase gets NO
# CI run; the push to the branch is what runs it (B-PLAN-CURRENCY-CHECK, §10i).
# Checks: TypeScript compilation, test suite (vitest, plus the governance
# checker's plain-node tests as steps inside Test Suite), build, Docker build.
#
# Note: No linting step — the project does not have ESLint configured.
# Tests use Vitest (see package.json).

name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [dawntrader-v4, main, 'migration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check (baseline gate)
    runs-on: ubuntu-latest
    # B-NEW-43 chunk 5 (2026-05-23): replaced `continue-on-error: true` (which
    # silently swallowed ALL tsc errors and let the codebase accumulate ~700
    # type errors unnoticed) with a per-file-per-code baseline-comparison gate.
    # The frozen baseline lives at `.tsc-baseline.json` (585 errors at freeze,
    # commit 0519224, B-NEW-43). CI fails on any (file, code) count above
    # baseline or any new (file, code) pair. See scripts/check-tsc-baseline.mjs
    # for the comparison logic and the anti-graveyard discipline (per-batch
    # enumeration + Kyle-approval soft cap on additions). No `continue-on-error`
    # — the gate gates.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript baseline-comparison gate
        run: node scripts/check-tsc-baseline.mjs

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # B-NEW-43 Phase 2 chunk 2 (2026-05-23): CI Postgres service container + db:migrate
    # bootstrap added per pre-audit §4.3 + §7. Previously the test job ran against
    # a hardcoded `postgresql://test:test@localhost:5432/test` URL (vitest.config.ts:10)
    # with NOTHING listening — producing the ~9 DB_CONNECTION failures and the ~54
    # NOT_WARM failures (warmModuleConstantsForSyncCallers hard-throws on zero rows
    # in `module_constants`, which only gets populated by data-migration files).
    # The `db:migrate` step applies all ~58-60 forward migrations (rollback files
    # auto-skipped by scripts/db-migrate.ts) → full schema + seed rows → harness
    # warming succeeds. Service container publishes Postgres on host port 5432
    # to match the vitest hardcode (no vitest config change needed).
    # MUST use `db:migrate` NOT `db:push` — drizzle-kit push is broken on this
    # schema's PG ARRAY column defaults (see scripts/db-migrate.ts header for
    # the full rationale).
    services:
      postgres:
        # B-NEW-43 Phase 2 chunk 4.2: pgvector/pgvector:pg17 (PG 17 + pgvector ext)
        # instead of bare postgres:17-alpine. Staging Supabase has pgvector
        # enabled (semantic_memory.embedding column type public.vector(1536) +
        # HNSW index public.vector_cosine_ops). The initial-schema migration
        # references both. Bare postgres:17-alpine doesn't ship pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # B-DB-MAP: the checked-in baseline's R/C fence needs the commit that last
          # wrote manifest.json plus its source ancestor, not only the tip tree.
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations (schema + seed data)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      # B-DB-MAP (KD-101): pure catalog/adapter/scanner/provenance/schedule tests plus a disposable
      # PostgreSQL control proving one statement holds one snapshot while a split-statement mutant does not.
      # The generator uses fixtures here; CI never connects to staging and never claims live freshness.
      - name: Database-map integrity and snapshot tests
        run: |
          node scripts/db-map/tests/core.test.mjs
          node scripts/db-map/tests/mutations.test.mjs
          node scripts/db-map/tests/schedule.test.mjs
          python3 scripts/db-map/tests/drift-enrollment.test.py
          node scripts/db-map/tests/connection-control.mjs
          node scripts/db-map/tests/snapshot-control.mjs
          node scripts/db-helper-retire/tests/validator.test.mjs
          node scripts/db-helper-retire/validate.mjs
          python3 comms-infra/staging/tests/db_helper_retire_tests.py
          artifact_ref="$(git log -1 --format=%H HEAD -- docs/database-map/manifest.json)"
          test "${#artifact_ref}" = 40
          node scripts/db-map/verify.mjs --repo . --root docs/database-map --artifact-ref "$artifact_ref"
          curl --fail --location --silent --show-error --output /tmp/tbls.tar.gz https://github.com/k1LoW/tbls/releases/download/v1.97.0/tbls_v1.97.0_linux_amd64.tar.gz
          test "$(wc -c < /tmp/tbls.tar.gz)" = 31694635
          echo '43c81f408495d9b626d0265a6ebb57c6d1c4a5e072d3eecc3e88825cc6c64e9a  /tmp/tbls.tar.gz' | sha256sum --check --status
          tar -xzf /tmp/tbls.tar.gz -C /tmp tbls
          test "$(sha256sum /tmp/tbls | cut -d ' ' -f 1)" = 44bf748bf0b8f4ed66c21173d19792714a61953b5dff21da8805cb7caa1f6258
          DT_DB_MAP_TBLS=/tmp/tbls node scripts/db-map/tests/render-control.mjs
          bash -n comms-infra/staging/install-dt-db-map
          bash -n comms-infra/staging/dt-db-map-weekly
          bash -n comms-infra/staging/dt-db-map-stale
          bash -n comms-infra/staging/install-dt-db-helper-retire
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Verify locked staging deploy prerequisites in a sandbox
        run: python3 scripts/test-dt-deploy-windows.py

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test
          # vitest.config.ts:10 hardcodes the same URL — host-port-published
          # service container makes both this step + vitest agree without
          # touching vitest.config.ts. Setting here for explicitness.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          # B-NEW-32 (2026-05-15): external-macro-feed.ts requires this env var
          # at module-import time per the no-silent-fallback discipline. Tests
          # that import transitively (e.g. b68-4-regime-age via market-context-
          # engine) would otherwise crash. Demo is the safe test default — the
          # feed isn't actually polled during tests.
          COINGECKO_API_TIER: demo

      # B-WORKFLOW-IMPROVE OBJ-10 (Q9): pgEnum declarations against pg_enum in this migrated database, both
      # directions. Advisory: continue-on-error keeps it OUTSIDE the required result (Langston, Step-2 r2).
      # A red here is a finding to read in the log, never a reason to merge past a red required step.
      - name: Enum parity (advisory, not required)
        # Langston Step-4 gate 2 C-2: without this guard the step is SKIPPED whenever the Test Suite step
        # before it fails (measured: run 44663698365), so the advisory signal vanishes on exactly the red runs.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx vitest run --config vitest.enum-parity.config.ts --reporter=verbose
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          COINGECKO_API_TIER: demo

      - name: Access-hardening tool tests
        run: |
          python3 comms-infra/crew-switch/test_crew_switch.py
          python3 comms-infra/codex/test_coltrane_reviewer_role.py
          python3 comms-infra/laptop/ssh-keyholder/test_ssh_keyholder.py
          python3 comms-infra/laptop/ssh-keyholder/test_verify_caller_census.py
          python3 comms-infra/laptop/ssh-keyholder/test_ps_native.py
          python3 comms-infra/security/reviewer-staging-access/reviewer_staging_access.py self-test
          bash -n comms-infra/security/ssh/manage-ssh-hardening.sh
          bash comms-infra/security/ssh/manage-ssh-hardening.sh self-test
          bash -n comms-infra/security/fail2ban/manage-fail2ban.sh
          bash comms-infra/security/fail2ban/manage-fail2ban.sh self-test
          bash -n comms-infra/security/fail2ban/emit-invalid-ssh-attempts.sh
          bash -n comms-infra/security/fail2ban/verify-live-ban.sh
          bash comms-infra/security/fail2ban/verify-live-ban.sh self-test

      - name: Token-watch storage tests
        # B-TOKEN-WATCH-STORAGE (Langston, Step 4 part 2 re-review): the due prune, the feed-watch probe and the
        # installer's fences had no CI carrier. Stdlib only; the suite makes its own store root under tempfile.
        run: |
          python3 token-watch/tests/test_due_storage.py
          python3 token-watch/tests/mutate_due_storage.py
          python3 token-watch/tests/test_birthcap_review_export.py
          python3 token-watch/tests/mutate_birthcap_review_export.py
          python3 token-watch/tests/test_measure_followup_memory.py
          python3 token-watch/tests/test_p2b_memory_fixes.py
          # P2b-2 (B-TOKEN-WATCH-FOLLOWUP-MEMORY): the new walk, identity lookup, prev release and streamed promote read,
          # plus the suites of the three modules it changes (promote, the census read path, the creator-stake backfill)
          python3 token-watch/tests/test_p2b2_memory_fixes.py
          python3 token-watch/tests/test_promote.py
          python3 token-watch/tests/test_census_correction.py
          python3 token-watch/tests/test_creator_stake.py
          python3 token-watch/tests/test_p4_lock.py
          python3 token-watch/tests/test_p5_error_requeue.py
          python3 token-watch/tests/test_p6_fence_and_writer.py
          python3 token-watch/tests/test_p9_journals.py
          # P10 fold (B-TOKEN-WATCH-FOLLOWUP-MEMORY, Langston Step 4): tier carried by the follow-up's tail + its mutants
          python3 token-watch/tests/test_p10_tier_tail.py
          python3 token-watch/tests/mutate_p10_tier_tail.py
          python3 token-watch/tests/test_birthcap.py
          python3 token-watch/tests/mutate_birthcap.py
          # B-DB-READ-TOOL (KD-96) + B-DB-READONLY-ROLE (KD-100): dt-sql, its login step dt-sql-login, the psql wrapper,
          # + mutants over all three (the one-attempt listener check runs where psql exists)
          python3 comms-infra/staging/tests/dt_sql_tests.py
          python3 comms-infra/staging/tests/dt_sql_login_tests.py
          python3 comms-infra/staging/tests/dt_sql_role_setup_tests.py
          python3 comms-infra/staging/tests/dt_sql_mutations.py
          python3 token-watch/tests/test_p11_cold_census.py
          python3 token-watch/tests/test_p8_census.py
          python3 token-watch/tests/test_p7_obs_fold.py
          python3 token-watch/tests/test_p7_birth_stamp.py
          python3 token-watch/tests/test_p7_states.py
          python3 token-watch/tests/test_p7_summary_stream.py
          python3 token-watch/tests/test_install_cap_guard.py
          python3 token-watch/tests/test_collector.py
          python3 token-watch/tests/test_round2.py
          python3 token-watch/tests/test_wiring.py
          pwsh -NoProfile -Command '$e=$null;[Management.Automation.Language.Parser]::ParseFile("comms-infra/laptop/ssh-keyholder/install.ps1",[ref]$null,[ref]$e)>$null;if($e){$e|% Message;exit 1}'
          pwsh -NoProfile -Command '$e=$null;[Management.Automation.Language.Parser]::ParseFile("comms-infra/laptop/ssh-keyholder/capture_caller_processes.ps1",[ref]$null,[ref]$e)>$null;if($e){$e|% Message;exit 1}'
          pwsh -NoProfile -Command '$e=$null;[Management.Automation.Language.Parser]::ParseFile("comms-infra/laptop/ssh-keyholder/rollback.ps1",[ref]$null,[ref]$e)>$null;if($e){$e|% Message;exit 1}'

      # B-PLAN-CURRENCY-CHECK P30 (OBJ-10, Langston Q10: mandatory). The
      # governance checker's own tests. A push to the checker deploys to the
      # staging box within ~30 min (its ExecStartPre fast-forward), outside
      # dt-deploy, so this step DETECTS a failing checker commit after the
      # push; it does not gate that deploy. The pre-push local run is the gate.
      # LABELLED DEPARTURE (Q33, scope §10i): §10c approved "the CI job"; this
      # is a STEP inside Test Suite instead, so the four-job count stays true.
      # `if: !cancelled()` runs it even when vitest fails, so a vitest failure
      # cannot hide a checker failure. Plain node, node builtins only: needs
      # neither npm ci nor Postgres. Each step has its own `if`, so a failing
      # poller step does not hide the heartbeat step either. The heartbeat
      # tests use temp files only; one of them runs `bash -lc` against a
      # directory that does not exist, to show a failed resolve keeps its id.
      - name: Governance checker tests (poller)
        if: ${{ !cancelled() }}
        run: node scripts/governance-checker/poller.test.mjs

      - name: Governance checker tests (heartbeat)
        if: ${{ !cancelled() }}
        run: node scripts/governance-checker/heartbeat-check.test.mjs

      # B-TOKEN-ECONOMY P5: CLAUDE.md size cap (WARN-ONLY: --ci prints ::warning:: and
      # exits 0) and the move ledger (BLOCKING since Step 4, Langston 2026-11-19: no --ci).
      # The self-tests do fail the step, since a broken checker is not a warning.
      - name: CLAUDE.md size cap (warn-only) and move ledger (blocking)
        if: ${{ !cancelled() }}
        run: |
          node scripts/crew-tooling/claude-md-cap.mjs --self-test
          node scripts/crew-tooling/move-ledger-check.mjs --self-test
          node scripts/crew-tooling/claude-md-cap.mjs --ci --report
          node scripts/crew-tooling/move-ledger-check.mjs --dupes
          # B-WORKFLOW-IMPROVE Q10: the step-skill -> shared-contract / archive moves, same blocking rule.
          node scripts/crew-tooling/move-ledger-check.mjs --ledger "Claude Comms and Packages/Change Lists/B_WORKFLOW_IMPROVE_MOVE_LEDGER.json" --dupes

      # B-PLAN-CURRENCY-CHECK P43 (P30/Q33 form): the weekly census's rule
      # fixtures, pure over text (no git, no network, no files). Its own step
      # and its own `if`, like the two above, so no checker step hides another.
      - name: Governance checker tests (census)
        if: ${{ !cancelled() }}
        run: node scripts/governance-checker/census.test.mjs

      # The LIVE plan's pre-sprint table, read by the weekly census (B-STATUS-BOARD retirement re-homed these legs):
      # every status maps to a state, no one-copy conflict, every row pointer resolves, stage + order unique.
      - name: Governance checker tests (plan table)
        if: ${{ !cancelled() }}
        run: node scripts/governance-checker/plan-table.test.mjs

      # B-WAKE-OWNER-LOSS-VISIBLE (#1142, Langston Step-2 B1): the wake filter's forced-failure legs and the alert hook's
      # pure split logic, so the lost-routing record's write AND read paths are evaluated on every push, not only on the
      # laptop. Same P30/Q33 form: a step inside Test Suite, its own `if`, no npm ci or Postgres needed. The filter
      # suite's Windows-only held-file legs print SKIP here by design; the directory and read-only legs run.
      - name: Wake filter tests (owner record, lost routing)
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/test-wake-filter-cuts.py
      # B-WAKE-STATE-UNSAVED-LOUD (#1151): a save or read of the position that fails is said, and the run still ends.
      # The runner is non-root, so chmod denies a write; each case proves the deny before trusting it, and a root
      # runner would report SKIP with the reason rather than a vacuous pass.
      - name: Wake filter tests (position save and read failures)
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/test-wake-state-unsaved.py
      # B-WAKE-SELF-ADVANCE-LEAD (#1177): Langston's review queue - its ordering, markers and caps, and who a reply
      # is addressed to (a queue reply must open with the requester's name, or it wakes nobody). The module imports
      # fcntl, so this suite cannot run on Windows; CI is its only grader. Pure Python, no installs.
      - name: Langston queue tests (addressee, ordering, caps)
        if: ${{ !cancelled() }}
        run: python3 comms-infra/discord/langston_queue_test.py
      # B-LANGSTON-TWO-WORKERS (#1248): the lane key (exact, normalised, fail-closed to one shared lane) and the
      # two-worker task queue; then the mutation runner, which must catch every broken lane rule (judged by exit code).
      - name: Langston lane tests (two workers)
        if: ${{ !cancelled() }}
        run: python3 comms-infra/discord/test_langston_lanes.py && (cd comms-infra/discord && python3 mutate_langston_lanes.py)
      # B-TOKEN-ECONOMY amendment 1, P6: the alert lane's owner-table routing - the shared rules, apply_table, and
      # run_alert_batch itself (a table batch, the fallback, a failed or unparseable mirror read escalating the whole
      # batch without invoking the lane); then the mutation runner, judged by exit code. Imports fcntl: CI only.
      - name: Alert lane owner-table tests (P6)
        if: ${{ !cancelled() }}
        run: python3 comms-infra/discord/alert_owner_route_test.py && (cd comms-infra/discord && python3 mutate_alert_owner_route.py)
      # B-WAKE-LEASE-PID-REUSE (#1179): the wake lease's holder decision as a 24-row truth table, read out of the REPO
      # copy of the filter with ast. Green here does not prove the laptop's hand-installed copy (the #1004 class).
      - name: Wake lease verdict tests (pid reuse)
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/test-wake-lease-verdict.py
      # B-DISK-FILE-TIERING P9 residual (Langston, Discord 1573403358495248597): the price-side window extractor's
      # selftest - restart exclusion, start coverage (the rotation prepend and its gaps) and the PM2-log guards, on a
      # synthetic corpus in a temp directory. Pure Python stdlib, no installs; exits 1 on any failed expectation.
      - name: Window extractor selftest (start coverage, restarts)
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/p4c-window-extract-selftest.py

      - name: Alert hook tests (split, lost routing)
        if: ${{ !cancelled() }}
        run: node scripts/analysis/test-alert-split.mjs

      # B-PM-CLAUDE P1d (KD-28): the slot check's gatherer, both guards and the ledger's kind/citation rules.
      # The replay case reads the ledger's history, so the shallow checkout is deepened first.
      - name: PM slot check tests (gatherer, guards, ledger)
        if: ${{ !cancelled() }}
        run: |
          git fetch --unshallow --quiet || true
          node scripts/pm/test-slot-check.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js not found" && exit 1)
          test -d dist/public || (echo "ERROR: dist/public/ not found" && exit 1)
          echo "Build output verified: dist/index.js + dist/public/"

      # B-DB-POOL-GUARD r4 C-1 (Langston, Step 4, 2026-11-21): LOAD the built bundle, do not just check it exists.
      # A named import of a CommonJS package passed every unit test (vitest rewrites imports) and failed to load in
      # dist/ with "Named export not found" -- caught only by hand before the push. This step boots dist/index.js
      # against the database transport gate, which server/index.ts imports first, so no network is ever touched:
      #   1. an unencrypted URL must exit non-zero, its first [DB_ line must be the refusal, and no pool may be built;
      #   2. the control: a TLS-shaped URL must log the pass and THEN the pool init, proving step 1's
      #      "no [DB_POOL_INIT]" is a silence this instrument can break. The placeholder CA is never used to connect
      #      (port 1 refuses first). Node prints the throw's source location above it, so "first [DB_ line", not line 1.
      - name: Boot the built bundle against the database transport gate
        run: |
          clean() { env -u PGSSLMODE -u PGSSLROOTCERT -u NODE_TLS_REJECT_UNAUTHORIZED -u PGHOST "$@"; }
          out="$RUNNER_TEMP"
          set +e
          clean DATABASE_URL='postgresql://x:y@127.0.0.1:1/x' timeout 60 node dist/index.js > "$out/refuse.log" 2>&1
          rc=$?
          set -e
          cat "$out/refuse.log" | head -20
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then echo "ERROR: unencrypted URL did not stop the app (exit $rc)"; exit 1; fi
          first=$(grep -m1 -F '[DB_' "$out/refuse.log" || true)
          case "$first" in *'[DB_TLS_BOOT_CHECK] refused: ssl_not_object'*) ;; *) echo "ERROR: first [DB_ line is not the refusal: $first"; exit 1;; esac
          if grep -qF '[DB_POOL_INIT]' "$out/refuse.log"; then echo "ERROR: a pool was built before the gate refused"; exit 1; fi
          printf 'placeholder\n' > "$out/ca.crt"
          set +e
          clean DATABASE_URL="postgresql://x:y@localhost:1/x?sslmode=verify-full&sslrootcert=$out/ca.crt" timeout 30 node dist/index.js > "$out/pass.log" 2>&1
          set -e
          lines=$(grep -F '[DB_' "$out/pass.log" | head -2 || true)
          echo "$lines"
          l1=$(printf '%s\n' "$lines" | sed -n 1p); l2=$(printf '%s\n' "$lines" | sed -n 2p)
          case "$l1" in '[DB_TLS_BOOT_CHECK] passed:'*) ;; *) echo "ERROR: control did not log the pass first: $l1"; exit 1;; esac
          case "$l2" in '[DB_POOL_INIT]'*) ;; *) echo "ERROR: control did not build a pool after the pass: $l2"; exit 1;; esac
          echo "Bundle boot verified: refusal before any pool; control passes then builds the pool."

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dawntrader:ci-${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm dawntrader:ci-${{ github.sha }} node -e "console.log('Container starts OK')"
