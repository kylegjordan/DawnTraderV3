# DawnTrader CI Pipeline
# Runs on a push to dawntrader-v4, main or any 'migration/**' branch, and on a
# pull request whose BASE branch has no '/' in its name. The pull_request
# filter '*' does not match '/', so a PR into migration/aws-supabase gets NO
# CI run; the push to the branch is what runs it (B-PLAN-CURRENCY-CHECK, §10i).
# Checks: TypeScript compilation, test suite (vitest, plus the governance
# checker's plain-node tests as steps inside Test Suite), build, Docker build.
#
# Note: No linting step — the project does not have ESLint configured.
# Tests use Vitest (see package.json).

name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [dawntrader-v4, main, 'migration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check (baseline gate)
    runs-on: ubuntu-latest
    # B-NEW-43 chunk 5 (2026-05-23): replaced `continue-on-error: true` (which
    # silently swallowed ALL tsc errors and let the codebase accumulate ~700
    # type errors unnoticed) with a per-file-per-code baseline-comparison gate.
    # The frozen baseline lives at `.tsc-baseline.json` (585 errors at freeze,
    # commit 0519224, B-NEW-43). CI fails on any (file, code) count above
    # baseline or any new (file, code) pair. See scripts/check-tsc-baseline.mjs
    # for the comparison logic and the anti-graveyard discipline (per-batch
    # enumeration + Kyle-approval soft cap on additions). No `continue-on-error`
    # — the gate gates.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript baseline-comparison gate
        run: node scripts/check-tsc-baseline.mjs

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # B-NEW-43 Phase 2 chunk 2 (2026-05-23): CI Postgres service container + db:migrate
    # bootstrap added per pre-audit §4.3 + §7. Previously the test job ran against
    # a hardcoded `postgresql://test:test@localhost:5432/test` URL (vitest.config.ts:10)
    # with NOTHING listening — producing the ~9 DB_CONNECTION failures and the ~54
    # NOT_WARM failures (warmModuleConstantsForSyncCallers hard-throws on zero rows
    # in `module_constants`, which only gets populated by data-migration files).
    # The `db:migrate` step applies all ~58-60 forward migrations (rollback files
    # auto-skipped by scripts/db-migrate.ts) → full schema + seed rows → harness
    # warming succeeds. Service container publishes Postgres on host port 5432
    # to match the vitest hardcode (no vitest config change needed).
    # MUST use `db:migrate` NOT `db:push` — drizzle-kit push is broken on this
    # schema's PG ARRAY column defaults (see scripts/db-migrate.ts header for
    # the full rationale).
    services:
      postgres:
        # B-NEW-43 Phase 2 chunk 4.2: pgvector/pgvector:pg17 (PG 17 + pgvector ext)
        # instead of bare postgres:17-alpine. Staging Supabase has pgvector
        # enabled (semantic_memory.embedding column type public.vector(1536) +
        # HNSW index public.vector_cosine_ops). The initial-schema migration
        # references both. Bare postgres:17-alpine doesn't ship pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations (schema + seed data)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test
          # vitest.config.ts:10 hardcodes the same URL — host-port-published
          # service container makes both this step + vitest agree without
          # touching vitest.config.ts. Setting here for explicitness.
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          # B-NEW-32 (2026-05-15): external-macro-feed.ts requires this env var
          # at module-import time per the no-silent-fallback discipline. Tests
          # that import transitively (e.g. b68-4-regime-age via market-context-
          # engine) would otherwise crash. Demo is the safe test default — the
          # feed isn't actually polled during tests.
          COINGECKO_API_TIER: demo

      # B-PLAN-CURRENCY-CHECK P30 (OBJ-10, Langston Q10: mandatory). The
      # governance checker's own tests. A push to the checker deploys to the
      # staging box within ~30 min (its ExecStartPre fast-forward), outside
      # dt-deploy, so this step DETECTS a failing checker commit after the
      # push; it does not gate that deploy. The pre-push local run is the gate.
      # LABELLED DEPARTURE (Q33, scope §10i): §10c approved "the CI job"; this
      # is a STEP inside Test Suite instead, so the four-job count stays true.
      # `if: !cancelled()` runs it even when vitest fails, so a vitest failure
      # cannot hide a checker failure. Plain node, node builtins only: needs
      # neither npm ci nor Postgres. The heartbeat step is added with P28,
      # which creates heartbeat-check.test.mjs.
      - name: Governance checker tests (poller)
        if: ${{ !cancelled() }}
        run: node scripts/governance-checker/poller.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js not found" && exit 1)
          test -d dist/public || (echo "ERROR: dist/public/ not found" && exit 1)
          echo "Build output verified: dist/index.js + dist/public/"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dawntrader:ci-${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm dawntrader:ci-${{ github.sha }} node -e "console.log('Container starts OK')"
