[Service]
# Langston self-advance loop (B-LANGSTON-QUEUE #345, re-enabled 2026-06-24): re-invoke Langston on
# the next ready queue item after each reply until the queue drains. Repo-tracked + installed by
# deploy.sh (B-DISCORD-INBOUND-LIVENESS #462 — previously hand-created on the box, so a redeploy
# silently dropped it). Disable = remove this drop-in + daemon-reload + restart.
Environment=LANGSTON_SELF_ADVANCE=1
