[Unit]
# Parity with discord-langston-bridge and discord-cc-bridge (2026-09-11). Restart=always already
# recovers a crash; this pages when the bot crash-loops past its StartLimit and STOPS - the case
# where Coltrane would otherwise go unreachable.
# ⛔ B-WAKE-OPENING-LIST P4 (Langston MF-A, #1241): with the unit's RestartSec=15 and systemd's default
#    StartLimitIntervalSec=10s, five starts can never fall inside one window, so the unit never reached
#    `failed`-and-stopped and the PHONE page could never fire. 5min puts five 15-s starts (~60 s) inside
#    the window: ~60 s of continuous start failure stops the unit and pages with --notify. Stop-and-page,
#    not page-and-keep-restarting (Langston's ruling on the trade).
#    DRILLED 2026-11-05 (systemd 255) on scratch units with the same values and the REAL
#    bridge-failed-notify.sh, cc-send shadowed by a stub (never Kyle's page). MEASURED: OnFailure fires on
#    EVERY failed start, not only at the latch (also on record: B_DISCORD_INBOUND_LIVENESS_COMPLETION_REPORT
#    .md:33) - the script's "recorded a failure ... activating again" branch, posted without --notify. So 10s
#    was NOT silent: a channel post every 15 s, forever, no phone push. 5min: 5 such posts, then the stop and
#    ONE --notify "FAILED-LATCHED" page.
# ⚠️ StartLimitBurst COUNTS EVERY START, NOT ONLY FAILURES (drilled the same night): a Type=simple scratch
#    unit with these two values took 5 manual `systemctl restart`s and FAILED on the 6th (start-limit-hit).
#    So six starts of ANY kind inside five minutes - including hand restarts while installing or debugging -
#    latch the bot and page Kyle. Before restarting it more than a few times: `systemctl reset-failed
#    coltrane-bot.service` between restarts, or expect the page.
StartLimitIntervalSec=5min
StartLimitBurst=5
OnFailure=discord-bridge-failed-notify@%n.service
