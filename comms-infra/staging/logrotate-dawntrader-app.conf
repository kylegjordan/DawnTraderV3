# B-DISK-FILE-TIERING P9 (pre-audit P9 + amendment 3): rotation and compression for the app's own logs.
# Installed at /etc/dawntrader/logrotate-app.conf and run ONLY by dawntrader-logrotate.timer, with its own
# state file (/var/lib/logrotate/dawntrader-app.status). It is deliberately NOT in /etc/logrotate.d/: the
# distribution's daily logrotate would process it a second time under a second state file, and two rotators
# on one file is the failure this replaced (pm2-logrotate, uninstalled in the same step).
# Install map: comms-infra/staging/README.md. Plan: B_DISK_FILE_TIERING_CHANGE_LIST.md, "P9 + amendment 3".

# --- the two pm2 streams ------------------------------------------------------------------------
# Archive names keep pm2-logrotate's shape: error__2026-11-21_00-01-37.log, then .log.gz one rotation
# later (delaycompress). The time is the real run instant; content is the PRECEDING UTC day, because the
# first run after 00:00Z rotates (the D+1 rule in workflow-07-verify-cc). The dateformat glob also matches
# the archives pm2-logrotate left, so they age out under the same count.
# error.log keeps a size ceiling (pm2-logrotate's one max_size covered both streams): 2G is above the
# largest observed error day (312 MB), so it never binds in normal operation; a stderr burst at stdout
# rates rotates sub-daily instead of growing one file until 00:00Z. A day rotated twice is then split
# across two archives, and the day-keyed readers refuse it rather than read half (p4c-window-extract.py).
/var/log/dawntrader/error.log {
    su deploy deploy
    daily
    maxsize 2G
    rotate 30
    dateext
    dateformat __%Y-%m-%d_%H-%M-%S
    extension .log
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}

# stdout runs ~3.5 GB/day: the size trigger (checked hourly) keeps one file under ~1 GB, maxage bounds the
# days kept. rotate 60 is a ceiling that should never bind (~4 rotations a day x 7 days).
/var/log/dawntrader/out.log {
    su deploy deploy
    daily
    maxsize 1G
    rotate 60
    maxage 7
    dateext
    dateformat __%Y-%m-%d_%H-%M-%S
    extension .log
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}

# --- two job logs the storage health check reads ---------------------------------------------------
# b-storage-archival-health.ts runCheck judges each nightly job by the LIVE file's mtime against its cron
# cadence, and by AP-7's start/done lines over the live file plus <log>.1. So, binding, not style:
#   - no dateext: <log>.1 must exist under that name;
#   - delaycompress: <log>.1 stays plain text;
#   - notifempty: an empty live file is never rotated over a full .1;
#   - postrotate touch -r: the new empty live file gets the OLD mtime back, so a rotation can never make a
#     stalled job look fresh. A stalled job still fails AP-7, because live + .1 then hold only an old start.
# monthly runs at 00:xx on the 1st, clear of the 02:15, 02:45 and 03:00 runs. Written by root's crontab.
/var/log/dawntrader/disk-file-tiering.log /var/log/dawntrader/b75-retention.log {
    su root root
    monthly
    rotate 12
    compress
    delaycompress
    notifempty
    missingok
    create 0644 root root
    sharedscripts
    postrotate
        for f in /var/log/dawntrader/disk-file-tiering.log /var/log/dawntrader/b75-retention.log; do
            [ -f "$f.1" ] && [ -f "$f" ] && touch -r "$f.1" "$f"
        done
        exit 0
    endscript
}

# --- amendment 3: the SQE rejection diagnostic, one append-forever file ---------------------------
/home/deploy/dawntrader/logs/diagnostics/sqe_rejections.log {
    su deploy deploy
    size 10M
    rotate 5
    compress
    delaycompress
    create 0664 deploy deploy
    missingok
    notifempty
}

# NOT here, on purpose:
#   /home/deploy/.pm2/pm2.log - its reader (scripts/analysis/xs_frame_extract.sh BOUNDARIES) reads it as one
#     file; a Step-10 review with that reader's owner decides it.
#   /home/deploy/.pm2/logs/ - after the uninstall nothing writes there (dawntrader-error.log is 0 B since 06-26).
